# Copy to config.toml and adapt. config.toml is ignored by Git.
# Secrets (API token, webhooks...) never go here: use .env (see .env.example).

# Only these private ranges (RFC 1918) may be scanned. Prefix /16 or longer.
allowed_subnets = ["192.168.1.0/24"]

# Optional trusted MACs; applies only to observed devices inside allowed_subnets.
# Example (invented): known_devices = ["00:11:22:33:44:55"]
# Removing an entry does not revoke a persisted known status; MACs can be spoofed.
known_devices = []

database_path = "nettracker.db"
log_level = "INFO"

[scan]
# "passive" reads the system ARP table; "active" sends ARP/ping probes (M2+).
mode = "passive"
interval_seconds = 60
# Targeted active name queries require this AND --resolve-mdns.
mdns_enabled = false
# Per-host timeout for --resolve-mdns only (0.1 to 5 seconds); disabled without flag.
mdns_timeout_seconds = 1.0
# Optional fallback after raw ARP fails; still requires active mode and CLI opt-in.
nmap_fallback = false
# Total subprocess timeout, between 1 and 120 seconds.
nmap_timeout_seconds = 30

[monitor]
# Active ICMP requires this AND --enable-monitoring; no periodic runner yet.
enabled = false
packets = 3
# Per attempt; process hard deadline adds 0.5 seconds for cleanup.
timeout_seconds = 1.0
# Refuse stale discovery records (60 to 86400 seconds).
max_observation_age_seconds = 1800

[retention]
# Deleting old ping samples requires enabled = true AND `nettracker prune-history --apply`.
# Without --apply the command only previews. Only ping samples are ever deleted.
enabled = false
# Ping samples strictly older than this many days are prunable (1 to 3650).
keep_days = 30
# Rows deleted per transaction (1 to 5000) and maximum batches per run (1 to 1000).
batch_size = 500
max_batches = 100

[health]
# `nettracker health-check` reports the collector as stale after this many minutes without
# a successful scan (1 to 10080). Keep it well above your real scan interval (2-3x or more).
stale_after_minutes = 15

[alerts]
# While true, `nettracker process-alerts` only records dry-run rows: nothing is ever sent.
# false needs a configured notifier (none exists yet), otherwise the command refuses to run.
dry_run = true
# Same event kind on the same device alerts at most once per this many minutes (1 to 1440).
cooldown_minutes = 30
# Events handled per `process-alerts` run (1 to 1000).
max_events_per_run = 200
# An `offline` event alerts only once this old, and not if the device came back (0 to 1440).
# 0 alerts immediately.
offline_after_minutes = 5
# Alert when the mean of the last 3 answered pings exceeds this many ms (1 to 60000).
latency_high_ms = 200

[api]
# Keep loopback unless you set NETTRACKER_API_TOKEN in .env.
host = "127.0.0.1"
port = 8080
